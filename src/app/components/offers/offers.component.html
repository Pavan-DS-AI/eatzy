<div class="container mt-4">
  <div class="row justify-content-center">
    <div *ngFor="let coupon of coupons" class="col-md-4 d-flex justify-content-center mb-4">
      <div class="card shadow coupon-card" style="width: 18rem;">
        <div class="card-body text-center">
          <span class="badge bg-success discount-label">{{ coupon.discount }}</span>
          <h5 class="card-title mt-2">{{ coupon.code }}</h5>
          <p class="text-muted">{{ coupon.additionalInfo }}</p>
          <p>{{ coupon.description }}</p>

          <button (click)="applyCoupon(coupon.code)" class="btn btn-primary w-100 mb-2">APPLY</button>
          <button (click)="toggleDetails(coupon)" class="btn btn-outline-secondary w-100">
            {{ coupon.showMore ? 'SHOW LESS' : '+ MORE' }}
          </button>

          <div *ngIf="coupon.showMore" class="mt-3">
            <ul class="list-group">
              <li *ngFor="let detail of coupon.details" class="list-group-item">{{ detail }}</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>



<h2>Payment Offers</h2>
<!-- New Payment Offers Section -->
<div class="payment-offer-container">
  
  <div *ngFor="let paymentOffer of paymentOffers" class="payment-offer-card">
    <div class="discount-label1">{{ paymentOffer.discount }}</div>
    <div class="offer-details">
      <h3>{{ paymentOffer.code }}</h3>
      <p class="additional-info">{{ paymentOffer.additionalInfo }}</p>
      <p>{{ paymentOffer.description }}</p>
      
      <button (click)="applyPaymentOffer(paymentOffer.code)" class="apply-btn">APPLY</button>
      <button (click)="togglePaymentOfferDetails(paymentOffer)" class="more-btn">
        {{ paymentOffer.showMore ? 'SHOW LESS' : '+ MORE' }}
      </button>

      <div *ngIf="paymentOffer.showMore" class="extra-details">
        <p *ngFor="let detail of paymentOffer.details">{{ detail }}</p>
      </div>
    </div>
  </div>
</div>
