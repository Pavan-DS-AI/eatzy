<div class="wholearea">
  <div class="container mt-4">
    <div class="row g-2">
      <div class="col-md-4 mb-4" *ngFor="let item of menudetails">
        <div class="card">
          <img [src]="item.image" class="card-img-top" alt="{{ item.name }}">
          <div class="card-body">
            <h5 class="card-title">{{ item.name }}</h5>
            <p class="card-text">Price: ₹{{ item.price }}</p>
            <div class="d-flex justify-content-between align-items-center">
              <button class="btn btn-danger" (click)="removeFromCart(item)" [disabled]="getQuantity(item) === 0">-</button>
              <span>{{ getQuantity(item) }}</span>
              <button class="btn btn-success" (click)="addToCart(item)">+</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container mt-4 text-center">
    <button class="btn btn-primary cartbtn" (click)="viewCart()">View Cart (₹{{ getTotalAmount() }})</button>
  </div>
</div>
