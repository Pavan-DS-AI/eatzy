<div class="container-fluid">
    <div class="row">
      <!-- First Card (Top-Left) -->
      <div class="col-md-4 col-12">
        <div class="card first-card">
          <div class="card-body">
            <img src="https://media.istockphoto.com/id/483120255/photo/asian-oranage-chicken-with-green-onions.jpg?s=612x612&w=0&k=20&c=0T_g_J5OSnmCei1Slgr1128wzAhzceRvLjd94R3gkgs=" class="card-img-top" alt="Food Image">
            <img src="assets/logo.png" height="120" width="120" class="imglogocard" alt="Logo">
            <p>Welcome to Eatzy. The Delicious Items Are Available for You.</p>
          </div>
        </div>
      </div>
  
      <!-- Second Card (Center - Login Form) -->
      <div class="col-md-4 col-12">
        <div class="card second-card">
          <div class="card-body">
            <img width="450" src="https://png.pngtree.com/png-clipart/20231121/original/pngtree-burgers-png-image_13675904.png" class="card-img-top" alt="Burger Image">
            <h3>Login</h3>
            <form [formGroup]="loginform" (ngSubmit)="login()">
              <div class="form-group mb-3">
                <input type="text" class="form-control" formControlName="username" required placeholder="Enter username" autocomplete="username">
              </div>
  
              <div class="form-group mb-3">
                <input type="password" class="form-control" formControlName="password" placeholder="Enter password" autocomplete="current-password">
              </div>
  
              <div class="d-flex justify-content-center mt-3">
                <button class="btn" type="submit">Submit</button>
              </div>
            </form>
          </div>
        </div>
      </div>
  
      <!-- Third Card (Bottom-Right) -->
      <div class="col-md-4 col-12">
        <div class="card third-card">
          <div class="card-body">
            <img src="https://media.istockphoto.com/id/1442417585/photo/person-getting-a-piece-of-cheesy-pepperoni-pizza.jpg?s=612x612&w=0&k=20&c=k60TjxKIOIxJpd4F4yLMVjsniB4W1BpEV4Mi_nb4uJU=" class="card-img-top" alt="Pizza Image">
            <img src="assets/logo.png" height="120" width="120" class="imglogocard" alt="Logo">
            <p>Welcome to Eatzy. The Delicious Items Are Available for You.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Background Image -->
  <div class="bgimage">
    <img src="https://png.pngtree.com/png-clipart/20231121/original/pngtree-burgers-png-image_13675904.png" height="800" width="900" alt="Background Image">
  </div>
